<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>News</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class="container my-5">

    <h1 class="text-center mb-4">News</h1>

    {% for simgle in hospital %}

    <div class="card mb-3">
        <div class="card-body">
            <img src="{{ simgle.image.url }}" 
                 class="img-fluid mb-2" 
                 style="max-height:200px;"
                 alt="Hospital Image">
            <a href="{% url 'detailslink' %}" ><h2 class="card-title">{{simgle.user}}</h2></a>
            <h6 class="card-subtitle mb-2 text-muted">{{simgle.age}}</h6>
            <h6 class="card-text">{{simgle.field}}</h6>
            <h6 class="card-text">{{simgle.proffession}}</h6>
            <h6 class="card-text">{{simgle.dr_department.name}}</h6>
        </div>
    </div>

    {% endfor %}



</div>
</html>
