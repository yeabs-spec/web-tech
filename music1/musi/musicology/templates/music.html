<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .music-card { transition: 0.3s; border-radius: 15px; }
        .music-card:hover { transform: scale(1.03); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .album-img { height: 200px; object-fit: cover; border-top-left-radius: 15px; border-top-right-radius: 15px; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'homeurl' %}">MUSIC<span>HUB</span></a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'homeurl' %}">Home</a>
                <a class="nav-link active" href="{% url 'musicurl' %}">Music</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for t in art %}
            <div class="col">
                <div class="card h-100 music-card border-0 shadow-sm">
                    <img src="{{ t.image.url }}" class="card-img-top album-img" alt="{{ t.name }}">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">{{ t.name }}</h5>
                        <div class="text-warning mb-2">
                            <p class="mb-0">Rating: {{ t.rating }} <i class="bi bi-star-fill"></i></p>
                        </div>
                        <p class="text-muted small">{{ t.mugory.name }}</p>
                        <a href="{% url 'detailurl' t.id %}" class="btn btn-outline-primary btn-sm w-100">View Details</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
